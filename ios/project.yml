name: Cheetah
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Cheetah:
    type: application
    platform: iOS
    sources:
      - path: Cheetah
        excludes:
          - Info.plist
          - Cheetah-Bridging-Header.h
          - CheetahFFI.h
          - Assets
      - path: Cheetah/Assets
        buildPhase: resources
      # The app's own native modules (`cheetah prebuild`).
      # cheetah:sources:begin
      # cheetah:sources:end
    dependencies:
      - framework: Libs/Runtime.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Cheetah
        INFOPLIST_FILE: Cheetah/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Cheetah/Cheetah-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Cheetah"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App identity from apps/<app>/cheetah.toml (`cheetah prebuild`);
        # CHEETAH_DEFAULT_APP is the app that opens without launch arguments.
        # cheetah:settings:begin
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cheetah
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CHEETAH_DEFAULT_APP: chat
        CHEETAH_DISPLAY_NAME: "Cheetah"
        CODE_SIGN_ENTITLEMENTS: Cheetah/Generated/Cheetah.entitlements
        # cheetah:settings:end
        # `cheetah fingerprint ios`; dev builds report it to the dev server,
        # which says when native code changed and a new dev build is needed.
        CHEETAH_NATIVE_FINGERPRINT: unknown

  CheetahUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheetahUITests
    dependencies:
      - target: Cheetah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cheetah.uitests
        TEST_TARGET_NAME: Cheetah
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cheetah:
    build:
      targets:
        Cheetah: all
        CheetahUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CheetahUITests
