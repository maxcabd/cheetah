name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build Rust XCFramework
        shell: bash
        run: |
          set -o pipefail
          chmod +x ios/build-rust.sh
          ./ios/build-rust.sh 2>&1 | tee /tmp/rust-ios.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            tail -60 /tmp/rust-ios.log
            grep -E "error:|error " /tmp/rust-ios.log | head -20 | while IFS= read -r line; do
              echo "::error title=Rust iOS::${line}"
            done
          fi
          exit $status

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            tail -60 /tmp/xcodegen.log
            grep -E "error:|Error" /tmp/xcodegen.log | head -20 | while IFS= read -r line; do
              echo "::error title=XcodeGen::${line}"
            done
          fi
          exit $status

      - name: Build iOS app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cheetah.xcodeproj \
            -scheme Cheetah \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|fatal error:" /tmp/xcodebuild.log | head -40 | while IFS= read -r line; do
              echo "::error title=Xcode::${line}"
            done
          fi
          exit $status

      - name: Publish iOS failure log
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          for file in /tmp/rust-ios.log /tmp/xcodegen.log /tmp/xcodebuild.log; do
            if [ -f "$file" ]; then
              cp "$file" "ci-logs/$(basename "$file")"
            fi
          done
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "iOS CI failure logs" || true
          git push origin ci-logs --force
