name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build Rust XCFramework
        shell: bash
        run: |
          set -o pipefail
          chmod +x ios/build-rust.sh
          ./ios/build-rust.sh 2>&1 | tee /tmp/rust-ios.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            tail -60 /tmp/rust-ios.log
            grep -E "error:|error " /tmp/rust-ios.log | head -20 | while IFS= read -r line; do
              echo "::error title=Rust iOS::${line}"
            done
          fi
          exit $status

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            tail -60 /tmp/xcodegen.log
            grep -E "error:|Error" /tmp/xcodegen.log | head -20 | while IFS= read -r line; do
              echo "::error title=XcodeGen::${line}"
            done
          fi
          exit $status

      - name: Build iOS app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cheetah.xcodeproj \
            -scheme Cheetah \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|fatal error:" /tmp/xcodebuild.log | head -40 | while IFS= read -r line; do
              echo "::error title=Xcode::${line}"
            done
          fi
          exit $status

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk '
            /-- iOS 26/ { in_ios26 = 1; next }
            /^-- / { in_ios26 = 0 }
            in_ios26 && /iPhone/ { print; exit }
          ' | grep -o -E '[0-9A-F-]{36}') || true
          if [ -z "$DEVICE_ID" ]; then
            xcrun simctl list devices available
            echo "::error title=Simulator::No iOS 26 iPhone simulator available"
            exit 1
          fi
          echo "device=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cheetah.xcodeproj \
            -scheme Cheetah \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device }}" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild-sim.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|fatal error:" /tmp/xcodebuild-sim.log | head -40 | while IFS= read -r line; do
              echo "::error title=Xcode simulator::${line}"
            done
          fi
          exit $status

      - name: Run simulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/simulator.log) 2>&1
          DEVICE_ID="${{ steps.simulator.outputs.device }}"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          python3 -c 'import subprocess, sys; subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=300)' "$DEVICE_ID"
          xcrun simctl install "$DEVICE_ID" build/sim/Build/Products/Debug-iphonesimulator/Cheetah.app
          xcrun simctl launch "$DEVICE_ID" com.example.cheetah
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/cheetah-ios.png

      - name: Publish iOS preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ios-preview
          mkdir -p ci-preview
          cp /tmp/cheetah-ios.png ci-preview/cheetah-ios.png
          git add -f ci-preview
          git commit -m "iOS simulator preview" || true
          git push origin ios-preview --force

      - name: Publish Nightshade preview
        shell: bash
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.device }}"
          xcrun simctl terminate "$DEVICE_ID" com.example.cheetah 2>/dev/null || true
          xcrun simctl launch "$DEVICE_ID" com.example.cheetah --nightshade
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/nightshade-empty-ios.png
          xcrun simctl terminate "$DEVICE_ID" com.example.cheetah 2>/dev/null || true
          xcrun simctl launch "$DEVICE_ID" com.example.cheetah --nightshade-demo
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/nightshade-ios.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B nightshade-preview
          mkdir -p ci-preview
          cp /tmp/nightshade-empty-ios.png ci-preview/nightshade-empty-ios.png
          cp /tmp/nightshade-ios.png ci-preview/nightshade-ios.png
          git add -f ci-preview
          git commit -m "Nightshade simulator preview" || true
          git push origin nightshade-preview --force

      - name: Run UI tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Cheetah.xcodeproj \
            -scheme Cheetah \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device }}" \
            -derivedDataPath build/uitest \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/xcodebuild-uitest.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|failed|Failing tests" /tmp/xcodebuild-uitest.log | head -40 | while IFS= read -r line; do
              echo "::error title=iOS UI test::${line}"
            done
          fi
          exit $status

      - name: Drive Nightshade through XCUITest
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          CHEETAH_IOS_DESTINATION="platform=iOS Simulator,id=${{ steps.simulator.outputs.device }}" \
            cargo run -p cheetah-drive -- ios test tools/drive/nightshade.drive \
            2>&1 | tee /tmp/cheetah-drive.log

      - name: Publish performance report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-preview
          {
            echo "iOS 26 simulator scroll performance"
            grep -E "testScrollPerformance|measured|XCTOSSignpost|frame|hitch" /tmp/xcodebuild-uitest.log | tail -100 || true
          } > ci-preview/ios-performance.txt
          RESULT=$(find build/uitest/Logs/Test -maxdepth 1 -name '*.xcresult' | sort | tail -1)
          if [ -n "$RESULT" ]; then
            xcrun xcresulttool get test-results metrics --path "$RESULT" --compact > ci-preview/ios-performance.json || true
          fi
          git checkout -B ios-preview
          git add -f ci-preview
          git commit -m "iOS performance report" || true
          git push origin ios-preview --force

      - name: Publish iOS failure log
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          for file in /tmp/rust-ios.log /tmp/xcodegen.log /tmp/xcodebuild.log /tmp/xcodebuild-sim.log /tmp/simulator.log /tmp/xcodebuild-uitest.log /tmp/cheetah-drive.log; do
            if [ -f "$file" ]; then
              cp "$file" "ci-logs/$(basename "$file")"
            fi
          done
          DEVICE_ID="${{ steps.simulator.outputs.device }}"
          if [ -n "$DEVICE_ID" ]; then
            python3 -c 'import subprocess, sys; subprocess.run(["xcrun", "simctl", "io", sys.argv[1], "screenshot", "ci-logs/uitest-failure.png"], timeout=30)' "$DEVICE_ID" || true
          fi
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "iOS CI failure logs" || true
          git push origin ci-logs --force
