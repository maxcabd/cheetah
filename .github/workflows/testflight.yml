name: TestFlight

# Builds a signed iOS release and uploads it to TestFlight. Run it from the
# Actions tab. Builds sign with one reused distribution certificate and an
# App Store profile from `cheetah setup ios` (secrets IOS_DISTRIBUTION_P12,
# IOS_DISTRIBUTION_PASSWORD, IOS_PROFILE_DEV, IOS_PROFILE_RELEASE), like EAS
# credentials. Without them signing falls back to automatic, which makes a new
# certificate per run until Apple's certificate limit stops builds.
#
# Required repository secrets:
#   APPLE_TEAM_ID                    Developer team ID (10 characters)
#   APP_STORE_CONNECT_KEY_ID         API key ID
#   APP_STORE_CONNECT_ISSUER_ID      API key issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY    Contents of the AuthKey_XXXX.p8 file
# Dev builds (dev_client, or `cheetah build ios --dev`) connect to
# `cheetah dev` and ship as a separate app, com.nightshade.cheetah.dev
# ("Cheetah Dev"), so release testers never get them. Create that app in App
# Store Connect once before the first dev build. They're only needed again
# when native code changes (`cheetah fingerprint ios`), so a push to main
# that changes native iOS code builds one automatically.
#
# Optional repository variable:
#   NIGHTSHADE_API_URL               HTTPS backend URL baked into the build;
#                                    unset, Nightshade uses its sample places

on:
  # Same files as `cheetah fingerprint ios`: Rust and .view changes never
  # need a dev build, since they run on the dev server.
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "!ios/CheetahUITests/**"
      - "!ios/Libs/**"
      - "!ios/Cheetah.xcodeproj/**"
      - "!ios/Cheetah/Generated/**"
      - "apps/*/cheetah.toml"
      - "apps/*/native/ios/**"
  workflow_dispatch:
    inputs:
      app:
        description: "App that opens on launch"
        type: choice
        options: [nightshade, nightshade-demo, chat]
        default: nightshade
      dev_client:
        description: "Dev build: connects to `cheetah dev` (separate Cheetah Dev app)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # Pushes build the dev client of nightshade.
  DEV_CLIENT: ${{ inputs.dev_client || github.event_name == 'push' }}
  CHEETAH_APP: ${{ inputs.app || 'nightshade' }}
  BUNDLE_ID: ${{ (inputs.dev_client || github.event_name == 'push') && 'com.nightshade.cheetah.dev' || 'com.nightshade.cheetah' }}
  # Name, IDs, permissions and links come from apps/nightshade/cheetah.toml
  # (`cheetah prebuild`); --dev adds the .dev ID, " Dev" name, and compiles
  # the dev server connection into the Release build.
  PREBUILD_FLAGS: ${{ (inputs.dev_client || github.event_name == 'push') && '--dev' || '' }}

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$PRIVATE_KEY" ] || missing+=(APP_STORE_CONNECT_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing secrets::Add these repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build Rust XCFramework (release, no source map)
        shell: bash
        env:
          CHEETAH_RUST_FEATURES: ""
          NIGHTSHADE_API_URL: ${{ vars.NIGHTSHADE_API_URL }}
        run: |
          set -o pipefail
          chmod +x ios/build-rust.sh
          ./ios/build-rust.sh 2>&1 | tail -40

      - name: Prebuild (app config into the Xcode project)
        shell: bash
        run: cargo run -q -p cheetah-cli -- prebuild --app nightshade $PREBUILD_FLAGS

      - name: Native fingerprint
        shell: bash
        run: |
          native=$(cargo run -q -p cheetah-cli -- fingerprint ios --app nightshade)
          echo "NATIVE_FINGERPRINT=$native" >> "$GITHUB_ENV"
          echo "Native fingerprint: $native"

      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Install App Store Connect API key
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Install signing credentials
        shell: bash
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          PROFILE_DEV: ${{ secrets.IOS_PROFILE_DEV }}
          PROFILE_RELEASE: ${{ secrets.IOS_PROFILE_RELEASE }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::warning title=Automatic signing::No reused certificate: run cheetah setup ios, or each build makes a new certificate until Apple's limit stops builds."
            echo "SIGNING=automatic" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$BUNDLE_ID" in
            *.dev) PROFILE="$PROFILE_DEV" ;;
            *) PROFILE="$PROFILE_RELEASE" ;;
          esac
          if [ -z "$PROFILE" ]; then
            echo "::error title=Missing profile::No App Store profile for $BUNDLE_ID: run cheetah setup ios"
            exit 1
          fi

          # The certificate, in a keychain of its own for this run.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # The profile, where Xcode looks for it (both locations: Xcode 16+
          # reads the second).
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          echo "SIGNING=manual" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Signing with the reused certificate and profile \"$NAME\""

      - name: Archive
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ "$SIGNING" = manual ]; then
            signing=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" \
              "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME")
          else
            signing=(-allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic)
          fi
          xcodebuild archive \
            -project ios/Cheetah.xcodeproj \
            -scheme Cheetah \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cheetah.xcarchive" \
            "${signing[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CHEETAH_DEFAULT_APP="$CHEETAH_APP" \
            CHEETAH_NATIVE_FINGERPRINT="$NATIVE_FINGERPRINT" \
            > "$RUNNER_TEMP/archive.log" 2>&1 && status=0 || status=$?
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" || true
          if [ "$status" -ne 0 ]; then tail -80 "$RUNNER_TEMP/archive.log"; fi
          exit "$status"

      - name: Upload to TestFlight
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ "$SIGNING" = manual ]; then
            SIGNING_OPTIONS="<key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>"
            provisioning=()
          else
            SIGNING_OPTIONS="<key>signingStyle</key><string>automatic</string>"
            provisioning=(-allowProvisioningUpdates)
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            ${SIGNING_OPTIONS}
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          # The upload authenticates with the API key either way.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cheetah.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${provisioning[@]}" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 && status=0 || status=$?
          grep -E "error:|Upload|\*\* EXPORT" "$RUNNER_TEMP/export.log" || true
          if [ "$status" -ne 0 ]; then tail -80 "$RUNNER_TEMP/export.log"; exit "$status"; fi
          {
            echo "## Uploaded to TestFlight"
            echo "- Bundle: \`$BUNDLE_ID\` build **${{ github.run_number }}**"
            echo "- Opens: \`$CHEETAH_APP\`"
            echo "- Dev build: $DEV_CLIENT (native \`$NATIVE_FINGERPRINT\`)"
            echo "- Backend: ${{ vars.NIGHTSHADE_API_URL || 'sample places (NIGHTSHADE_API_URL not set)' }}"
            echo "Processing on Apple's side takes a few minutes before the build appears in TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
