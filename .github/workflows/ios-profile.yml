name: iOS profile

# Where the app's CPU time goes while a test uses it: the simulator's process
# is sampled from the Mac, so nothing in the app changes. By hand:
#   gh workflow run ios-profile.yml -f tests="Results Page"
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Performance tests to profile (Startup, Results, Page)
        default: "Startup Results"

permissions:
  contents: read

concurrency:
  group: ios-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build
        run: |
          set -o pipefail
          brew install xcodegen
          chmod +x ios/build-rust.sh
          # As released: no developer source map.
          CHEETAH_RUST_FEATURES="" ./ios/build-rust.sh > /tmp/rust.log 2>&1 || { tail -30 /tmp/rust.log; exit 1; }
          (cd ios && xcodegen generate) && (cd ios/NativeTwin && xcodegen generate)
          DEVICE=$(xcrun simctl list devices available | awk '/-- iOS 26/ {f=1; next} /^-- / {f=0} f && /iPhone/ {print; exit}' | grep -oE '[0-9A-F-]{36}')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/NativeTwin/NativeTwin.xcodeproj -scheme NativeTwin -sdk iphonesimulator \
            -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/twin \
            CODE_SIGNING_ALLOWED=NO build > /tmp/twin.log 2>&1
          xcrun simctl install "$DEVICE" build/twin/Build/Products/Release-iphonesimulator/NativeTwin.app
          xcodebuild build-for-testing -project ios/Cheetah.xcodeproj -scheme Cheetah -sdk iphonesimulator \
            -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/perf \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > /tmp/build.log 2>&1 || { grep error: /tmp/build.log; exit 1; }

      - name: Profile
        env:
          TEST_RUNNER_NATIVE_TWIN: "1"
          TEST_RUNNER_PROFILE: "1"
          TESTS: ${{ inputs.tests }}
        run: |
          mkdir -p /tmp/profiles
          # Its permission alert would sit over the first launch and take the
          # tests' taps, which go to positions.
          xcrun simctl install "$DEVICE" build/perf/Build/Products/Release-iphonesimulator/Cheetah.app
          xcrun simctl privacy "$DEVICE" grant location com.example.cheetah
          for test in $TESTS; do
            for side in Cheetah Native; do
              app=$([ "$side" = Cheetah ] && echo Cheetah || echo NativeTwin)
              name="$side$test"
              rm -f /tmp/cheetah-profile-start
              xcodebuild test-without-building -project ios/Cheetah.xcodeproj -scheme Cheetah -sdk iphonesimulator \
                -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/perf \
                -only-testing:"CheetahUITests/CheetahPerformanceTests/test$name" > "/tmp/profiles/$name.test.log" 2>&1 &
              runner=$!
              # One sample, started once the test is only tapping: writing a
              # sample takes long enough to miss what follows it.
              while kill -0 $runner 2>/dev/null && [ ! -f /tmp/cheetah-profile-start ]; do sleep 0.3; done
              pid=$(pgrep -f "/$app.app/$app( |$)" | head -1 || true)
              if [ "$test" = Startup ]; then
                # A new process each launch: sample the next few from their start.
                for n in 1 2 3 4; do
                  old=$pid
                  for i in $(seq 1500); do
                    pid=$(pgrep -f "/$app.app/$app( |$)" | head -1 || true)
                    [ -n "$pid" ] && [ "$pid" != "$old" ] && break
                    sleep 0.01
                  done
                  [ -n "$pid" ] && sample "$pid" 4 1 -mayDie -file "/tmp/profiles/$name.$n.txt" > /dev/null 2>&1 || true
                done
              elif [ -n "$pid" ]; then
                ps -o pid,time,rss -p "$pid" | tee "/tmp/profiles/$name.before.txt"
                sample "$pid" 20 4 -mayDie -file "/tmp/profiles/$name.1.txt" > /dev/null 2>&1 || true
                ps -o pid,time,rss -p "$pid" | tee "/tmp/profiles/$name.after.txt" || true
              fi
              wait $runner || echo "$name failed"
              grep -E "measured \[|swift:[0-9]+: error" "/tmp/profiles/$name.test.log" | cut -c1-200 || true
            done
          done
          ls -la /tmp/profiles

      - name: Startup timeline
        if: always()
        run: |
          xcrun simctl privacy "$DEVICE" grant location com.example.cheetah.twin || true
          for pair in "Cheetah com.example.cheetah --nightshade-demo" "NativeTwin com.example.cheetah.twin"; do
            set -- $pair
            for n in 1 2 3; do
              xcrun simctl terminate "$DEVICE" "$2" 2>/dev/null || true
              sleep 4
              started=$(date "+%Y-%m-%d %H:%M:%S")
              python3 -c 'import time; print("launch asked", time.strftime("%H:%M:%S"), time.time() % 1)' > "/tmp/profiles/$1.timeline.$n.txt"
              xcrun simctl launch "$DEVICE" "$2" $3
              sleep 8
              xcrun simctl spawn "$DEVICE" log show --start "$started" --info --debug --signpost --style compact \
                --predicate "process == \"$1\"" >> "/tmp/profiles/$1.timeline.$n.txt" 2>&1 || true
            done
          done
          wc -l /tmp/profiles/*.timeline.*

      - name: Film the map
        if: always()
        env:
          TEST_RUNNER_NATIVE_TWIN: "1"
          TEST_RUNNER_FILM: "1"
        run: |
          xcrun simctl location "$DEVICE" set 37.7749,-122.4194
          for side in Cheetah Native; do
            xcodebuild test-without-building -project ios/Cheetah.xcodeproj -scheme Cheetah -sdk iphonesimulator \
              -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/perf \
              -only-testing:"CheetahUITests/CheetahPerformanceTests/test${side}Film" > "/tmp/profiles/film$side.log" 2>&1 || true
          done
          cp /tmp/cheetah-film-*.png /tmp/profiles/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiles
          path: /tmp/profiles
