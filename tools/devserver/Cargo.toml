[package]
name = "cheetah-devserver"
version = "0.1.0"
edition = "2021"
description = "Run Cheetah apps on the desktop and render them on a device over WebSocket"

[lib]
name = "cheetah_devserver"
path = "src/lib.rs"

[[bin]]
name = "cheetah-devserver"
path = "src/main.rs"

[[bin]]
name = "cheetah-dev"
path = "src/bin/cheetah-dev.rs"

[dependencies]
base64 = "0.22.1"
cheetah-cli = { path = "../cli" }
cheetah-render = { path = "../render" }
dioxus-devtools = "0.7.10"
futures-util = { version = "0.3.34", features = ["sink"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
runtime = { path = "../../crates/runtime", features = ["devserver", "source-map"] }
serde_json = "1"
subsecond = "0.7.10"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
