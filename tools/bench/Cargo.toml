[package]
name = "cheetah-bench"
version = "0.1.0"
edition = "2021"

# It includes the app's source, whose tests belong to apps/nightshade.
[[bin]]
name = "cheetah-bench"
path = "src/main.rs"
test = false

[dependencies]
runtime = { path = "../../crates/runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
