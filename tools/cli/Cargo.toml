[package]
name = "cheetah-cli"
version = "0.1.0"
edition = "2021"
description = "The cheetah command: dev server, dev builds, fingerprints, doctor"

[lib]
name = "cheetah_cli"
path = "src/lib.rs"

[[bin]]
name = "cheetah"
path = "src/main.rs"

[dependencies]
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
