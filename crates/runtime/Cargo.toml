[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Dev-only call-site metadata for the agent tree. Enable this in local host
# builds; production builds should leave it off.
source-map = []

[dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
redb = "4.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.15.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
